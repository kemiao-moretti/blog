module:
  hugoVersion:
    min: 0.164.0

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/x-solitude-search:
    suffixes: [xml]
  application/x-solitude-links:
    suffixes: [json]

outputFormats:
  Search:
    mediaType: application/x-solitude-search
    baseName: search
    isPlainText: false
    notAlternative: true
  Links:
    mediaType: application/x-solitude-links
    baseName: links
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

params:
  _merge: deep
  solitude:
    site:
      name:
        class: text
        custom: Solitude
      icon: /img/avatar.png
    nav:
      group: {}
      right:
        random: true
        custom: []
    hometop:
      enable: true
      banner:
        title: Solitude
        desc: A fast, elegant and feature-rich Hugo theme
        icon: {}
      group: {}
      recommendList: []
    aside:
      position: 1
      home:
        noSticky: about
        Sticky: allInfo
      post:
        noSticky: about
        Sticky: newestPost,allInfo
      page:
        noSticky: about
        Sticky: newestPost,allInfo
      my_card:
        author:
          img: /img/avatar.png
          emoji:
          sticker:
        description: A Hugo theme for expressive personal sites.
        content: Write, collect, and share with Solitude.
        state:
          morning: Good morning
          noon: Good noon
          afternoon: Good afternoon
          night: Good evening
          goodnight: Good night
        witty_words: []
        information: []
      toc:
        post: true
        page: false
        vague: true
      tags:
        enable: true
        limit: 20
        highlight_list: []
      siteinfo:
        postcount: true
        wordcount: true
        updatetime: true
        runtimeenable: true
        runtime: 2023-04-20 00:00:00
    page:
      error: true
      tags: true
      categories: true
      archives: 0
      links:
        async_threshold: 200
      default:
        cover: [/img/default.avif]
    post:
      default:
        cover: [/img/default.avif]
        locate: China
        copyright:
          enable: true
          author: /img/avatar.png
          author_background: ""
          license: CC BY-NC-SA 4.0
          licenurl: https://creativecommons.org/licenses/by-nc-sa/4.0/
      meta:
        date: true
        updated: true
        locate: true
        wordcount: true
        readtime: true
        pv: false
        comment: false
      award:
        enable: false
        list: []
      share:
        enable: false
        list: []
      rss: /index.xml
      covercolor:
        enable: false
        mode: local
        api: https://api.qjqq.cn/api/Imgcolor?img=
        time: 43200000
    theme_color:
      dark: "#ffc848"
      light: "#425aef"
      nav_hover_text:
        dark: "#1b1c20"
        light: "#ffffff"
    display_mode:
      type: auto
    font:
      font_size: 16px
      code_font_size: 16px
      font_family: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      code_font_family: "ui-monospace, SFMono-Regular, Menlo, monospace"
      # 可选：网络字体的 CSS 地址（含 @font-face 声明）。留空则只用系统字体。
      # 例：朱雀仿宋的分片 CSS，浏览器按 unicode-range 只下载用到的分片。
      webfont_css: ""
    index_post_list:
      direction: column
      column: 2
      cover: both
    related_post:
      enable: true
      limit: 3
      date_type: created
    expire:
      enable: false
      time: 30
      position: top
      text_prev: 本文最后更新于
      text_next: 天前，部分内容可能已经失效。
    right_menu:
      enable: true
      # Hide the custom context menu on matching page types/layouts/kinds.
      exclude:
        - music
      commentBarrage: false
      ctrlOriginalMenu: false
      translate: false
      music: false
      limit: 50
      author: "Author: "
      link: "Link: "
      source: "Source: Solitude"
      info: ""
      img_error: Unable to download image
      mode:
        dark: Dark mode
        light: Light mode
      barrage:
        open: Show comment barrage
        close: Hide comment barrage
      custom_list: []
    copy:
      enable: true
      copyright:
        enable: false
        limit: 50
    mermaid: true
    chart: true
    typeit: true
    console:
      enable: true
      recentComment:
        enable: false
        storage: 0.2
      card:
        tags: true
        archive: month
    translate:
      enable: false
      defaultEncoding: 2
      translateDelay: 0
    rightside:
      enable: true
      hide:
        enable: true
        translate: true
        mode: true
        aside: true
    footer:
      randomlink: false
      information:
        author: /img/avatar.png
        left: []
        right: []
      group: {}
      links: []
      beian: []
    errorpage:
      img: /img/404.avif
      text: =awa= Page Not Found
      recommendList: true
    # 外链中转：站外链接先经中转页核对目标域名再前往
    # 页面模板在 layouts/go/，运行时改写逻辑在 assets/ts/external_link.ts
    external_link:
      enable: false
      page: /go/ # 中转页路径，需与站点 content/go.md 对应
      param: u # 中转页承载目标的查询参数名
      # 改写时会额外拼上 r=<来源页路径>，供中转页「返回上一页」用。
      # 外链普遍带 target="_blank"，中转页在新标签里打开时 history 长度为 1，
      # history.back() 无处可去，只能靠 r 回到点链接时所在的页面。
      encode: base64url # 参数编码：base64url（默认，避免目标 URL 明文出现在地址栏）| none
      countdown: 4 # 自动前往的秒数；负数表示不自动跳转，只留手动按钮
      pause_on_hover: true # 倒计时期间指针悬停或键盘聚焦时暂停
      referrer_guard: false # true = 仅当来源为本站时才展示中转页，否则提示来源异常
      # 生效容器：只有落在这些选择器里的链接会被改写。三个默认值都是主题自身的标记。
      containers:
        - .post-content # 文章正文
        - "#banners" # 友链页顶部跑马灯
        - "#friend-links-list" # 友链页列表
      exclude: [] # 页面路径前缀黑名单，命中则整页不改写
      # 带这些属性的链接一律放过（data-fancybox 是灯箱图片锚点，不能当外链跳转）
      ignore_attrs:
        - data-fancybox
        - data-no-safego
      # 域名白名单：命中则视为站内，直接放行。按主机名后缀匹配，写 518339.xyz 即可覆盖 blog.518339.xyz
      whitelist: []
      appearance:
        eyebrow: 出站提醒
        title: "" # 留空则回落到站点标题
        subtitle: 你要离开本站了
        avatar: "" # 留空则回落到侧栏名片头像
        leave_text: 即将前往
        copy_text: 复制链接
        copied_text: 已复制
        # {seconds} 是倒计时数字的占位符，缺少占位符时只显示数字不显示数值
        countdown_text: 将在 {seconds} 秒后自动前往，请先确认链接安全
        manual_text: 请确认链接安全后，再点击「继续前往」
        confirm_text: 继续前往
        cancel_text: 返回上一页
        invalid_text: 这个跳转链接不完整或格式不对
        guard_text: 链接来源异常，本站不代为跳转
        pause_text: 已暂停自动跳转
        resume_text: 已继续自动跳转
        back_home: 回到首页
        noscript_text: 这个中转页需要 JavaScript 才能解析目标地址，请开启后重试，或直接回到首页。
    capsule:
      enable: false
      id: ""
      server: netease
      type: playlist
      volume: 0.8
    music:
      enable: false
      id: ""
      server: netease
      type: playlist
      volume: 0.8
      mutex: true
      order: list
    meting_api: https://api.injahow.cn/meting/?server=:server&type=:type&id=:id&r=:r
    keyboard:
      enable: false
      # modifier: shift | mod (Command on macOS, Ctrl elsewhere)
      # Each item must define exactly one of action or url.
      list: []
    lazyload:
      enable: true
      field: site
      placeholder: ""
      errorimg: /img/error_load.avif
    loading:
      fullpage: false
      pace: true
    highlight:
      _merge: shallow
      enable: true
      copy: true
      line_numbers: true
      themes:
        light: github-light
        dark: github-dark
    lightbox: fancybox
    memorial:
      enable: false
      date: []
    katex:
      enable: true
      per_page: true
      copytex: true
    pwa:
      enable: false
      manifest: /manifest.json
      theme_color: "#425aef"
      mask_icon: /img/pwa/favicon.png
      apple_touch_icon: /img/pwa/favicon.png
      favicon_32_32: /img/pwa/favicon_32.png
      favicon_16_16: /img/pwa/favicon_16.png
      bookmark_icon: /img/pwa/favicon.png
    comment:
      use: ""
      commentBarrage: false
      lazyload: false
      count: false
      sidebar: false
      pv: false
      avatar: https://weavatar.com
      hot_tip:
        enable: false
        count: 3
      newest_comment:
        enable: false
        storage: 0.5
        limit: 5
    twikoo:
      envId: ""
      region: ""
      style: true
      accessToken: ""
      option: {}
    waline:
      serverURL: ""
      pageview: false
      option: {}
    valine:
      appId: ""
      appKey: ""
      serverURLs: ""
      avatar: mp
      visitor: false
      style: true
      option: {}
    artalk:
      server: ""
      site: ""
      option: {}
    giscus:
      repo: ""
      repo_id: ""
      category_id: ""
      mapping: pathname
      theme:
        light: light
        dark: dark
      option: {}
    search:
      enable: true
      type: local
      tags: []
      local:
        preload: false
        CDN: /search.xml
      algolia:
        appId: ""
        apiKey: ""
        indexName: ""
        hits:
          per_page: 6
      docsearch:
        appId: ""
        apiKey: ""
        indexName: ""
        placeholder: ""
        option: {}
    envelope:
      enable: false
      line: 10
      speed: 20
      hover: true
      loop: true
      page: /message/
    brevity:
      enable: false
      home_mini: false
      music: false
      page: /essay/
      style: 1
      strip: 30
    recent_comments:
      enable: false
      limit: 50
      cache: 0.2
      page: /recentcomments/
    verify_site: []
    # 数据统计页（/stats/）
    stats:
      # 热力图右侧的星期标注；关掉可以省下左侧留白
      weekday_label: true
      # 一周从哪天开始，决定热力图第一行是星期几
      # 支持 sunday/monday/.../saturday（可写前三个字母缩写），或 0-6（0 = 周日）
      week_start: monday
      # 覆盖星期名；留空则取 i18n（clockWeek1..7，四语齐备）
      weekday_names: []
    extends:
      head: []
      body: []
    cdn:
      shiki: https://esm.sh/shiki@4.4.3
      fontawesome: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css
      pjax: https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js
      snackbar: https://cdn.jsdelivr.net/npm/node-snackbar@0.1.16/dist/snackbar.min.js
      lazyload: https://cdn.jsdelivr.net/npm/vanilla-lazyload@19.1.3/dist/lazyload.iife.min.js
      fancyapps_css: https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1.14/dist/fancybox/fancybox.css
      fancyapps_js: https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1.14/dist/fancybox/fancybox.umd.js
      mermaid: https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js
      chart: https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js
      echarts: https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js
      abcjs: https://cdn.jsdelivr.net/npm/abcjs@6.6.4/dist/abcjs-basic-min.js
      typeit: https://cdn.jsdelivr.net/npm/typeit@8.8.7/dist/index.umd.min.js
      katex_css: https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css
      katex_copytex: https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/contrib/copy-tex.min.js
      aplayer_css: https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css
      aplayer_js: https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js
      meting_js: https://cdn.jsdelivr.net/npm/meting@2.0.2/dist/Meting.min.js
      colorthief: https://cdn.jsdelivr.net/npm/colorthief@3.4.0/dist/umd/color-thief.global.min.js
      twikoo: https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.all.min.js
      waline_css: https://cdn.jsdelivr.net/npm/@waline/client@3.6.0/dist/waline.css
      waline: https://cdn.jsdelivr.net/npm/@waline/client@3.6.0/dist/waline.umd.js
      valine: https://cdn.jsdelivr.net/npm/valine@1.5.3/dist/Valine.min.js
      blueimp_md5: https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js
      artalk_css: https://cdn.jsdelivr.net/npm/artalk@2.9.1/dist/Artalk.css
      artalk: https://cdn.jsdelivr.net/npm/artalk@2.9.1/dist/Artalk.js
      algoliasearch: https://cdn.jsdelivr.net/npm/algoliasearch@5.46.3/dist/lite/builds/browser.umd.js
      instantsearch_css: https://cdn.jsdelivr.net/npm/instantsearch.css@8.9.0/themes/satellite-min.css
      instantsearch: https://cdn.jsdelivr.net/npm/instantsearch.js@4.84.0/dist/instantsearch.production.min.js
      docsearch_css: https://cdn.jsdelivr.net/npm/@docsearch/css@4.5.0/dist/style.css
      docsearch_js: https://cdn.jsdelivr.net/npm/@docsearch/js@4.5.0/dist/umd/index.js
