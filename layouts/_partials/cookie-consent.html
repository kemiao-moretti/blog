{{- $privacy := "privacy/" | relURL -}}
<aside
  id="cookie-consent"
  class="cookie-consent"
  role="dialog"
  aria-labelledby="cookie-consent-title"
  aria-describedby="cookie-consent-description"
  hidden
>
  <div class="cookie-consent__mark" aria-hidden="true">
    <i class="solitude fas fa-cookie-bite"></i>
  </div>
  <div class="cookie-consent__content">
    <h2 id="cookie-consent-title" class="cookie-consent__title">{{ i18n "cookieConsentTitle" }}</h2>
    <p id="cookie-consent-description" class="cookie-consent__description">
      {{ i18n "cookieConsentDescription" }}
      <a class="cookie-consent__link" href="{{ $privacy }}" data-no-pjax>{{ i18n "cookieConsentPrivacy" }}</a>
    </p>
  </div>
  <div class="cookie-consent__actions">
    <button id="cookie-consent-reject" class="cookie-consent__button cookie-consent__button--secondary" type="button">
      {{ i18n "cookieConsentReject" }}
    </button>
    <button id="cookie-consent-accept" class="cookie-consent__button cookie-consent__button--primary" type="button">
      {{ i18n "cookieConsentAccept" }}
    </button>
  </div>
</aside>
